<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFE9DC" />
  <title>每日背单词 · Daily Word</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Ma+Shan+Zheng&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <!-- ★ 版本号 v4：强制浏览器拉取最新样式 -->
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <canvas id="starfield"></canvas>
  <canvas id="confetti"></canvas>

  <!-- 音乐按钮 -->
  <button id="musicBtn" class="music-btn" title="音乐开关" aria-label="音乐开关">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="color:#C9A36B;">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
    </svg>
  </button>

  <!-- 顶部进度 -->
  <section class="top-panel">
    <div class="top-row">
      <span class="today-label" id="todayText">今日进度：0 / 0</span>
      <span class="streak" title="连续打卡">
        <span>🔥</span>
        <span class="streak-num" id="streakNum">0</span>
        <span id="streakUnit">天</span>
      </span>
    </div>

    <!-- ★ 日期显示 + 从头开始 -->
    <div class="date-row">
      <span class="date-text" id="dateText">今天是 …</span>
      <button class="restart-btn" id="restartBtn" title="从词库开头（A）重新开始连贯背诵">🔁 从头开始</button>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="study-row">
      <span class="study-label">📝 今日已学 <strong id="studyCount">0</strong> 个</span>
      <span class="study-detail">
        <span class="dot-known"></span><span id="knownCount">0</span>
        <span class="dot-unknown"></span><span id="unknownCount">0</span>
      </span>
    </div>
    <!-- ★ 累计掌握（永久累加） -->
    <div class="cumulative-row">
      <span class="cumulative-label">🏆 已累计掌握 <strong id="knownTotal">0</strong> 词</span>
      <span class="cumulative-detail">总进度 <span id="cumulativePct">0</span>%</span>
    </div>
  </section>

  <!-- ★★ 今日任务 + 每日一句 ★★ -->
  <section class="mission-area">
    <details class="mission-panel" id="missionPanel" open>
      <summary class="mission-head" id="missionHead" title="点击展开 / 收起">
        <span class="mission-title">📋 今日任务</span>
        <span class="mission-sub" id="missionSub">按词库顺序 · 每天 20 词</span>
        <span class="mission-toggle" id="missionToggle" aria-hidden="true">▾</span>
      </summary>
      <div class="mission-body" id="missionBody">
        <!-- ★ 去默写按钮（紧贴列表上方，始终可见） -->
        <div class="mission-actions">
          <button class="dictation-btn" id="dictationBtn">✍️ 去默写</button>
        </div>
        <div class="mission-list" id="missionList">
          <div class="mission-empty">今日任务加载中…</div>
        </div>
      </div>
    </details>

    <!-- ★ 历史回顾（独立常驻，不被列表挤出可视区） -->
    <div class="history-panel">
      <div class="history-row">
        <span class="history-label">📅 历史回顾</span>
        <select class="history-select" id="historySelect" aria-label="选择历史日期"></select>
      </div>
      <div class="history-list" id="historyList"></div>
      <div class="history-tip">📌 历史日期按「1月1日起每天 20 词」推算；仅供查看，不影响当前进度</div>
    </div>

    <!-- 每日一句：英文 + 中文翻译 -->
    <div class="quote-card">
      <span class="quote-mark">"</span>
      <div class="quote-text" id="quoteText">Every day may not be good, but there's something good in every day.</div>
      <div class="quote-zh" id="quoteZh">每一天未必都美好，但每一天都有值得珍惜的美好。</div>
      <div class="quote-label">— 每日一句 —</div>
    </div>
  </section>

  <!-- 单词翻转卡（含左右翻阅按钮） -->
  <section class="card-stage">
    <button class="nav-btn nav-prev" id="prevBtn" title="上一张" aria-label="上一张">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
      </svg>
    </button>

    <div class="flashcard" id="flashcard">
      <div class="face face-front">
        <div class="word-main" id="wordMain">word</div>
        <button class="speaker" id="speakBtn" title="朗读">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05a4.5 4.5 0 0 0 2.5-4.02zM14 3.23v2.06A7 7 0 0 1 14 18.7v2.06A9 9 0 0 0 14 3.23z"/></svg>
        </button>
        <div class="tap-hint" id="tapHint">轻触卡片 · 查看释义</div>
      </div>
      <div class="face face-back">
        <div class="word-main" id="wordMainBack" style="font-size:42px;margin-bottom:8px;"></div>
        <div class="phonetic" id="phonetic"></div>
        <span class="pos-tag" id="posTag"></span>
        <div class="meaning" id="meaning"></div>
        <div class="example" id="example"></div>
      </div>
    </div>

    <button class="nav-btn nav-next" id="nextBtn" title="下一张" aria-label="下一张">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
      </svg>
    </button>
  </section>

  <!-- 操作按钮 -->
  <div class="card-actions">
    <button class="action-btn btn-unknown" id="btnUnknown">
      <span class="btn-icon">❌</span>不认识
    </button>
    <button class="action-btn btn-known" id="btnKnown">
      <span class="btn-icon">✨</span>认识啦
    </button>
  </div>

  <!-- ★ 底部 Tab 区域：生词本 / 已掌握 / 错题集 / 全部词汇 -->
  <section class="tabs-area">
    <div class="tab-headers">
      <button class="tab-header active" data-tab="hard">📒 生词本 <span class="tab-count" id="hardCount">0</span></button>
      <button class="tab-header" data-tab="known">🏆 已掌握 <span class="tab-count" id="knownCountTab">0</span></button>
      <button class="tab-header" data-tab="wrong">📕 错题集 <span class="tab-count" id="wrongCount">0</span></button>
      <button class="tab-header" data-tab="all">📚 全部词汇 <span class="tab-count" id="allCount">0</span></button>
    </div>
    <div class="tab-body">
      <div class="tab-pane active" id="pane-hard">
        <div id="hardList"></div>
      </div>
      <div class="tab-pane" id="pane-known">
        <div id="knownList"></div>
      </div>
      <div class="tab-pane" id="pane-wrong">
        <div id="wrongList"></div>
      </div>
      <div class="tab-pane" id="pane-all">
        <input type="text" class="search-box" id="searchBox" placeholder="搜索单词或释义…" />
        <div id="allList"></div>
      </div>
    </div>
  </section>

  <!-- ★★ 默写模式：全屏遮罩 ★★ -->
  <div class="dictation-overlay" id="dictationOverlay" aria-hidden="true">
    <div class="dictation-box" id="dictationBox">
      <div class="dictation-top">
        <span class="dictation-progress" id="dictationProgress">1 / 20</span>
        <button class="dictation-close" id="dictationClose" title="退出默写">✕</button>
      </div>

      <!-- 答题区 -->
      <div class="dictation-stage" id="dictationStage">
        <div class="dictation-label">请写出对应的英文单词</div>
        <div class="dictation-meaning" id="dictationMeaning">…</div>
        <input class="dictation-input" id="dictationInput" type="text"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="输入英文后点提交（不区分大小写）" />
        <button class="dictation-submit" id="dictationSubmit">提交</button>
        <div class="dictation-feedback" id="dictationFeedback"></div>
      </div>

      <!-- 结果区 -->
      <div class="dictation-result" id="dictationResult" style="display:none">
        <div class="dictation-result-emoji" id="dictationResultEmoji">🎉</div>
        <div class="dictation-result-title">默写完成</div>
        <div class="dictation-result-score" id="dictationScore">正确率 0%</div>
        <div class="dictation-result-detail" id="dictationDetail"></div>
        <div class="dictation-result-btns">
          <button class="dictation-btn" id="dictationAgain">🔁 再练一次</button>
          <button class="dictation-btn dictation-btn-ghost" id="dictationDone">完成</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ★ 版本号 v4：强制浏览器拉取最新脚本 -->
  <script src="script.js?v=4"></script>
</body>
</html>
